name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test

      - name: Install Linux credential-test prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools

      - name: Test Linux credential migration in an isolated keyring
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          export HOME="$test_home"
          export XDG_DATA_HOME="$test_home/.local/share"
          export XDG_RUNTIME_DIR="$test_home/run"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export VSCE_TEST_KEYTAR_HOME="$test_home"
          export VSCE_TEST_KEYTAR_LINUX=1
          dbus-run-session -- bash -e -c '
            printf "%s" "vsce-test-keyring" | gnome-keyring-daemon --unlock --components=secrets
            npm test -- --grep "Native keytar migration \(Linux\)"
          '
